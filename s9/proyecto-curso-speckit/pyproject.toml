[project]
name = "proyecto-curso-speckit"
version = "0.1.0"
description = "Control de Gastos Personales con arquitectura limpia, REST API y FastMCP"
authors = [
    { name = "maximo.alvarez", email = "maxandres90@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt<4.1",
    "email-validator>=2.1.0",
    "fastapi>=0.110.0",
    "mcp[cli]<2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.25",
    "uvicorn[standard]>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]
